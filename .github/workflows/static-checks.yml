name: static-checks

on:
  push:
  pull_request:

jobs:
  verify-without-firmware-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static verification
        run: SKIP_COMPILE=1 tools/verify.sh
