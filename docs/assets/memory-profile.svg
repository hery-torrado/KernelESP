<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">KernelESP memory profile</title>
  <desc id="desc">Memory bars for RAM, IRAM and flash usage.</desc>
  <defs><style>.bg{fill:#f8fafc}.h{font:700 28px system-ui,Arial;fill:#102033}.t{font:15px system-ui,Arial;fill:#334155}.label{font:700 18px system-ui,Arial;fill:#102033}.bar{fill:#e2e8f0}.ram{fill:#0ea5e9}.iram{fill:#ef4444}.flash{fill:#22c55e}</style></defs>
  <rect class="bg" width="1000" height="420"/>
  <text x="60" y="58" class="h">KernelESP 0.10.0 memory profile</text>
  <text x="60" y="92" class="t">Last verified build after pipes and GitHub preparation</text>
  <text x="80" y="155" class="label">Global RAM</text><rect x="260" y="132" width="620" height="34" rx="8" class="bar"/><rect x="260" y="132" width="329" height="34" rx="8" class="ram"/><text x="900" y="155" class="t">42532 / 80192 bytes, 53%</text>
  <text x="80" y="225" class="label">IRAM</text><rect x="260" y="202" width="620" height="34" rx="8" class="bar"/><rect x="260" y="202" width="589" height="34" rx="8" class="iram"/><text x="900" y="225" class="t">62567 / 65536 bytes, 95%</text>
  <text x="80" y="295" class="label">Flash app</text><rect x="260" y="272" width="620" height="34" rx="8" class="bar"/><rect x="260" y="272" width="280" height="34" rx="8" class="flash"/><text x="900" y="295" class="t">473824 / 1048576 bytes, 45%</text>
  <text x="80" y="360" class="t">Runtime heap is normally around 30-33 KB free. IRAM is the tightest resource.</text>
</svg>
